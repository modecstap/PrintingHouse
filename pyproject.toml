[tool.black]
line-length = 80
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  frontend
  | \.venv
  | venv
  | backend/storage/alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 80
py_version = 312
src_paths = ["backend"]
known_first_party = ["backend"]
force_sort_within_sections = true
# Absolute imports only; no from . relative style.
skip_gitignore = true
extend_skip_glob = [
  "frontend/*",
  ".venv/*",
  "venv/*",
  "backend/storage/alembic/versions/*",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["backend"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_explicit = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = [
  "pydantic.mypy",
  "sqlalchemy.ext.mypy.plugin",
]

[[tool.mypy.overrides]]
module = "backend.test.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
